<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan 5S</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Tahoma, sans-serif;
    background: #d9dde2;
}

.topbar {
    height: 55px;
    background: #1a4385;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.topbar h1 {
    margin: 0;
    font-size: 24px;
}

.btn {
    border: 0;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.back {
    background: white;
    color: #1a4385;
}

.refresh {
    background: #107c41;
    color: white;
}

#status {
    text-align: center;
    padding: 10px;
    font-weight: bold;
    background: #fff3cd;
}

#pdfContainer {
    width: 100%;
    height: calc(100vh - 55px);
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.pdf-page {
    display: block;
    margin: 0;
    background: white;
    box-shadow: none;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

<div class="topbar">

    <button class="btn back"
        onclick="window.location.href='3Pillars.html'">
        ← Back
    </button>

    <h1>Plan 5S</h1>

    <button class="btn refresh"
        onclick="loadPDF()">
        Refresh
    </button>

</div>

<div id="status">
    PDF.JS MODE — กำลังโหลด Plan 5S...
</div>

<div id="pdfContainer"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const API_URL =
"https://api.github.com/repos/bumblebeepark08-cyber/SA/contents/data/plan5s.pdf?ref=data";


async function getPDFBytes() {

    const response = await fetch(
        API_URL + "&t=" + Date.now(),
        {
            cache: "no-store",
            headers: {
                "Accept": "application/vnd.github+json"
            }
        }
    );

    if (!response.ok) {
        throw new Error(
            "GitHub API " + response.status
        );
    }

    const file = await response.json();

    // ถ้า GitHub ส่ง content แบบ Base64 มา
    if (file.content) {

        const base64 =
            file.content.replace(/\n/g, "");

        const binary =
            atob(base64);

        const bytes =
            new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] =
                binary.charCodeAt(i);
        }

        return bytes;
    }

    // กรณีไฟล์ใหญ่ GitHub อาจไม่คืน content
    if (file.download_url) {

        const pdfResponse =
            await fetch(
                file.download_url +
                "?t=" + Date.now(),
                { cache: "no-store" }
            );

        if (!pdfResponse.ok) {
            throw new Error(
                "โหลด PDF " +
                pdfResponse.status
            );
        }

        const buffer =
            await pdfResponse.arrayBuffer();

        return new Uint8Array(buffer);
    }

    throw new Error(
        "GitHub ไม่ส่งข้อมูล PDF กลับมา"
    );
}


async function loadPDF() {

    const status =
        document.getElementById("status");

    const container =
        document.getElementById("pdfContainer");

    status.style.display = "block";
    status.style.color = "#000";
    status.innerText =
        "PDF.JS MODE — กำลังโหลด Plan 5S...";

    container.innerHTML = "";

    try {

        const pdfBytes =
            await getPDFBytes();

        const pdf =
            await pdfjsLib
                .getDocument({
                    data: pdfBytes
                })
                .promise;

        for (
            let pageNo = 1;
            pageNo <= pdf.numPages;
            pageNo++
        ) {

            const page =
                await pdf.getPage(pageNo);

            const original =
                page.getViewport({
                    scale: 1
                });

            const availableWidth =
                window.innerWidth - 10;

            const availableHeight =
                window.innerHeight - 65;

            const scale = Math.min(
                availableWidth / original.width,
                availableHeight / original.height
                );

            const viewport =
                page.getViewport({
                    scale: scale
                });

            const canvas =
                document.createElement("canvas");

            canvas.className =
                "pdf-page";

            canvas.width =
                Math.floor(viewport.width);

            canvas.height =
                Math.floor(viewport.height);

            container.appendChild(canvas);

            const ctx =
                canvas.getContext("2d");

            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;
        }

        status.innerText =
            "Plan 5S โหลดสำเร็จ ✓";

        setTimeout(() => {
            status.style.display = "none";
        }, 1500);

    }
    catch (error) {

        console.error(error);

        status.style.color = "red";

        status.innerText =
            "ERROR : " + error.message;
    }
}

loadPDF();

</script>

</body>
</html>
