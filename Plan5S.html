<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plan 5S</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Tahoma,sans-serif;
    background:#e9edf2;
}

.topbar{
    height:55px;
    background:#12377a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    color:white;
}

.topbar h1{
    margin:0;
    font-size:24px;
}

.btn{
    border:0;
    border-radius:6px;
    padding:9px 18px;
    cursor:pointer;
    font-size:15px;
}

.back{
    background:white;
    color:#12377a;
}

.refresh{
    background:#107c41;
    color:white;
}

#pdfFrame{
    width:100%;
    height:calc(100vh - 55px);
    border:0;
    display:block;
}
</style>
</head>

<body>

<div class="topbar">

    <button class="btn back"
        onclick="window.location.href='index.html'">
        ← Back
    </button>

    <h1>Plan 5S</h1>

    <button class="btn refresh"
        onclick="refreshPDF()">
        Refresh
    </button>

</div>

<iframe
    id="pdfFrame"
    src="">
</iframe>

<script>

const PDF_URL =
"https://raw.githubusercontent.com/bumblebeepark08-cyber/SA/data/data/plan5s.pdf";

function refreshPDF(){

    document.getElementById("pdfFrame").src =
        PDF_URL + "?t=" + Date.now();

}

refreshPDF();

/* เช็ก PDF ใหม่ทุก 5 นาที */
setInterval(refreshPDF, 300000);

</script>

</body>
</html>
