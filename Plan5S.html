<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plan 5S</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Tahoma, sans-serif;
        background: #ffffff;
    }

    .topbar {
        height: 55px;
        background: #12377a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        color: white;
    }

    .topbar h1 {
        margin: 0;
        font-size: 22px;
    }

    .btn {
        border: none;
        border-radius: 6px;
        padding: 9px 18px;
        font-size: 15px;
        cursor: pointer;
    }

    .back {
        background: white;
        color: #12377a;
    }

    .excel {
        background: #107c41;
        color: white;
    }

    .excel-frame {
        width: 100%;
        height: calc(100vh - 55px);
        border: 0;
        display: block;
        background: white;
    }
</style>
</head>

<body>

<div class="topbar">

    <button class="btn back"
        onclick="window.location.href='index.html'">
        ← Back
    </button>

    <h1>Plan 5S</h1>

    <button class="btn excel"
        onclick="window.open(
        'https://aisingroupap01.sharepoint.com/:x:/s/PE-D/IQCrTCZEzWYDTaXG6AtRTX_GAamona61csMx4QK2VBHodLc?e=sv7T6A',
        '_blank'
        )">
        Open Excel
    </button>

</div>

<iframe
    class="excel-frame"
    src="https://aisingroupap01.sharepoint.com/:x:/s/PE-D/IQCrTCZEzWYDTaXG6AtRTX_GAamona61csMx4QK2VBHodLc?e=sv7T6A&amp;action=embedview&amp;wdAllowInteractivity=True"
    frameborder="0">
</iframe>

</body>
</html>
