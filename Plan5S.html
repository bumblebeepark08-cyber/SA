<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plan 5S</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Tahoma,sans-serif;
    background:#dfe3e8;
}

.topbar{
    height:55px;
    background:#1a4385;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar h1{
    margin:0;
    font-size:24px;
}

.btn{
    border:0;
    border-radius:6px;
    padding:9px 18px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    background:white;
    color:#1a4385;
}

.refresh{
    background:#107c41;
    color:white;
}

#status{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:12px 20px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
    z-index:9999;
}

#pdfContainer{
    width:100%;
    padding:8px;
    text-align:center;
}

.pdf-page{
    display:block;
    margin:0 auto 12px auto;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="topbar">

    <button class="btn back"
        onclick="window.location.href='3Pillars.html'">
        ← Back
    </button>

    <h1>Plan 5S</h1>

    <button class="btn refresh"
        onclick="loadPDF()">
        Refresh
    </button>

</div>

<div id="status">
กำลังโหลด Plan 5S...
</div>

<div id="pdfContainer"></div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const API_URL =
"https://api.github.com/repos/bumblebeepark08-cyber/SA/contents/data/plan5s.pdf?ref=data";


window.loadPDF = async function(){

    const status =
        document.getElementById("status");

    const container =
        document.getElementById("pdfContainer");

    status.style.display = "block";
    status.style.color = "black";
    status.innerText = "กำลังโหลด Plan 5S...";

    container.innerHTML = "";

    try{

        // โหลด PDF เป็น binary ผ่าน GitHub API
        const response = await fetch(API_URL,{
            cache:"no-store",
            headers:{
                "Accept":"application/vnd.github.raw"
            }
        });

        if(!response.ok){
            throw new Error(
                "GitHub Error " + response.status
            );
        }

        const buffer =
            await response.arrayBuffer();

        const pdfData =
            new Uint8Array(buffer);

        const pdf =
            await pdfjsLib
                .getDocument({data:pdfData})
                .promise;


        for(
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ){

            const page =
                await pdf.getPage(pageNumber);

            const original =
                page.getViewport({scale:1});

            const availableWidth =
                window.innerWidth - 16;

            const scale =
                availableWidth /
                original.width;

            const viewport =
                page.getViewport({scale:scale});

            const canvas =
                document.createElement("canvas");

            canvas.className = "pdf-page";

            canvas.width =
                Math.floor(viewport.width);

            canvas.height =
                Math.floor(viewport.height);

            container.appendChild(canvas);

            const context =
                canvas.getContext("2d");

            await page.render({
                canvasContext:context,
                viewport:viewport
            }).promise;

        }

        status.innerText =
            "โหลดสำเร็จ ✓";

        setTimeout(()=>{
            status.style.display="none";
        },1000);

    }
    catch(error){

        console.error(error);

        status.style.color="red";

        status.innerText =
            "โหลด PDF ไม่สำเร็จ : " +
            error.message;
    }

}


loadPDF();

</script>

</body>
</html>
