<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5S Management Control Board</title>
    <!-- ลิงก์ไปยังไฟล์ CSS ของคุณ (สามารถย้าย CSS ใน <style> ด้านล่างนี้ไปไว้ในไฟล์ css5s.css ได้) -->
    <link rel="stylesheet" href="css5s.css">
    
    <style>
        /* รีเซ็ตค่าพื้นฐาน */
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f6f9; }
        
        /* จัดการ Header */
        .header99 {
            background-color: #1a2b72;
            color: white;
            text-align: center;
            padding: 15px;
            position: relative;
        }
        .header99 h1 { margin: 0; font-size: 24px; }
        .btn-Back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%); /* ให้อยู่กึ่งกลางแนวตั้งพอดี */
            background-color: #ddd;
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* โครงสร้างหลัก (Dashboard) */
        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 30px; /* ระยะห่างระหว่างแถวบน-ล่าง */
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* แถวสำหรับเรียงปุ่มและรูปภาพ */
        .row {
            display: flex;
            flex-wrap: wrap; /* หากจอเล็กเกินไปจะปัดตกบรรทัดให้อัตโนมัติ */
            gap: 15px; /* ระยะห่างระหว่างคอลัมน์ */
            justify-content: center; /* จัดให้อยู่กึ่งกลางหน้าจอ */
            align-items: flex-start;
        }

        /* กล่องย่อยสำหรับจับคู่ ปุ่ม + รูปภาพ */
        .item-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* ระยะห่างระหว่างปุ่มกับรูป */
        }

        /* สไตล์ปุ่ม */
        .item-box button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap; /* ไม่ให้ข้อความปุ่มขึ้นบรรทัดใหม่ */
            width: fit-content;
        }
        .item-box button:hover { background-color: #0056b3; }

        /* สไตล์รูปภาพ */
        .item-box img {
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            background-color: white;
        }

        /* กำหนดขนาดความกว้างตามสัดส่วน (อิงจากภาพตัวอย่าง image_14c03b.jpg) */
        .width-layout { width: 42%; } /* ภาพ Layout ใหญ่สุด */
        .width-small { width: 12%; } /* ภาพ 4 ภาพด้านขวาบน */
        .width-bottom { width: 31%; } /* ภาพ 3 ภาพแถวล่าง */

        /* สร้าง Responsive กรณีดูผ่านจอที่เล็กลง (Tablet/Mobile) */
        @media (max-width: 1024px) {
            .width-layout { width: 100%; }
            .width-small { width: 22%; }
            .width-bottom { width: 45%; }
        }
        @media (max-width: 768px) {
            .width-small, .width-bottom { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header99">
        <button class="btn-Back" onclick="window.location.href='index.html'">Back</button>
        <h1>5S MANAGMENT CONTROL BOARD</h1>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="dashboard-container">
        
        <!-- แถวบน -->
        <div class="row">
            <div class="item-box width-layout">
                <button class="btn-LayoutDetail" onclick="window.location.href='LayoutDetail.html'">Layout</button>
                <img src="Layout.jpg" alt="Layout 5S">
            </div>
            
            <div class="item-box width-small">
                <button class="btn-Role" onclick="window.location.href='Role.html'">บทบาทหน้าที่</button>
                <img src="Ka.jpg" alt="Role">
            </div>
            
            <div class="item-box width-small">
                <button class="btn-Rotation" onclick="window.location.href='Rotation.html'">Rotation Plan</button>
                <img src="Rotation.jpg" alt="Rotation Plan">
            </div>
            
            <div class="item-box width-small">
                <button class="btn-Itemlist" onclick="window.location.href='Itemlist.html'">Item List 5S</button>
                <img src="Itemlist1.jpg" alt="Item List">
            </div>
            
            <div class="item-box width-small">
                <button class="btn-Kaizen" onclick="window.location.href='Kaizen.html'">Kaizen Report</button>
                <img src="KAIZENREPORT.jpg" alt="Kaizen Report">
            </div>
        </div>

        <!-- แถวล่าง -->
        <div class="row">
            <div class="item-box width-bottom">
                <button class="btn-Plan5S" onclick="window.location.href='Plan5S.html'">Plan 5S Machine Making And AI</button>
                <img src="Plan5S.jpg" alt="Plan 5S">
            </div>
            
            <div class="item-box width-bottom">
                <button class="btn-Action" onclick="window.location.href='ActionPlan.html'">Action Plan 5S</button>
                <img src="Actionplan.jpg" alt="Action Plan">
            </div>
            
            <div class="item-box width-bottom">
                <button class="btn-Selfeva" onclick="window.location.href='Selfeva.html'">Self Eva</button>
                <img src="Selfeva.jpg" alt="Self Eva">
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
